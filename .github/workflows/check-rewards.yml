
name: Check public reward sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: satoshi-reward-check
  cancel-in-progress: false

jobs:
  check-rewards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public reward pages
        run: python scripts/check_rewards.py

      - name: Save report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rewards.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public rewards report"
            git push
          else
            echo "Report unchanged"
          fi
